name: hermes-zero-lab

services:
  workspace:
    image: mcr.microsoft.com/devcontainers/base:ubuntu-24.04
    command: sleep infinity
    working_dir: /workspaces/hermes-zero-lab
    volumes:
      - .:/workspaces/hermes-zero-lab:cached
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [lab]

  omniroute:
    image: diegosouzapw/omniroute:latest
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      NODE_ENV: production
      PORT: "20128"
      DATA_DIR: /app/data
      REQUIRE_API_KEY: "false"
    volumes:
      - ./.data/omniroute:/app/data
    ports:
      - "127.0.0.1:20128:20128"
    networks: [lab]
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:20128/v1/models').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  hermes:
    image: nousresearch/hermes-agent:latest
    restart: unless-stopped
    command: ["gateway", "run"]
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET}
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_KEY: ${API_SERVER_KEY}
      API_SERVER_CORS_ORIGINS: "*"
      OPENAI_API_KEY: ${OMNIROUTE_CLIENT_KEY:-hermes-zero-lab-internal}
    volumes:
      - ./.data/hermes:/opt/data
    ports:
      - "127.0.0.1:8642:8642"
      - "127.0.0.1:9119:9119"
    networks: [lab]
    depends_on:
      omniroute:
        condition: service_healthy

networks:
  lab:
    driver: bridge
