name: Bug report
description: Report a reproducible integration failure
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: environment
    attributes: {label: Environment}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Reproduction steps}
    validations: {required: true}
  - type: textarea
    id: evidence
    attributes: {label: Sanitized evidence}
    validations: {required: true}
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I ran `make doctor`.
          required: true
        - label: I removed credentials and private data.
          required: true
