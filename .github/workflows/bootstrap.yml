name: Bootstrap Repository

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand repository bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/chunk-00
          cat .bootstrap/chunk-* > /tmp/hermes-zero-lab.b64
          base64 --decode /tmp/hermes-zero-lab.b64 > /tmp/hermes-zero-lab.tar.gz
          tar -xzf /tmp/hermes-zero-lab.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit full repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Populate Hermes Zero Lab'
          git push
