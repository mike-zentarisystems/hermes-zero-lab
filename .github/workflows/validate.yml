name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck yamllint
      - name: Repository validation
        run: bash tests/validate-repo.sh
      - name: ShellCheck
        run: shellcheck -e SC1090,SC1091 .devcontainer/initialize.sh scripts/*.sh tests/*.sh
      - name: YAML
        run: >-
          yamllint -d '{extends: default, rules: {line-length: disable, truthy: disable}}'
          compose.yaml compatibility/*.yaml config/**/*.yaml .github/workflows/*.yml
